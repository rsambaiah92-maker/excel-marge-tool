<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Excel Merge Tool</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; color: #333; }
        .main-container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #1e3a8a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 0; display: flex; justify-content: space-between; align-items: center;}
        .brand { font-size: 16px; background: #ebf8ff; color: #2b6cb0; padding: 5px 15px; border-radius: 20px; font-weight: bold; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #4a5568; }
        input[type="file"], input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; }
        input[type="file"] { background: #edf2f7; border: 1px dashed #cbd5e0; cursor: pointer; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .checkbox-group { display: flex; align-items: flex-start; background: #fffaf0; padding: 12px; border: 1px solid #feebc8; border-radius: 6px; }
        .checkbox-group input { margin-right: 10px; margin-top: 5px; transform: scale(1.2); cursor: pointer; }
        .checkbox-group label { margin: 0; cursor: pointer; font-weight: normal; font-size: 14px;}
        .checkbox-group strong { display: block; margin-bottom: 3px; color: #2d3748; }

        .btn-container { display: flex; gap: 15px; margin-top: 25px; }
        button { padding: 12px 24px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .btn-merge { background-color: #2b6cb0; color: white; width: 50%; }
        .btn-merge:hover { background-color: #2c5282; }
        .btn-download { background-color: #2f855a; color: white; width: 50%; display: none; }
        .btn-download:hover { background-color: #22543d; }
        
        .status-box { margin-top: 15px; padding: 10px; border-radius: 6px; font-weight: 500; text-align: center;}
        
        .preview-section { margin-top: 30px; display: none; }
        .search-box { margin-bottom: 15px; padding: 10px; width: 100%; border: 2px solid #63b3ed; border-radius: 6px; font-size: 15px;}
        .table-responsive { overflow-x: auto; max-height: 400px; border: 1px solid #e2e8f0; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
        th { background-color: #edf2f7; color: #2d3748; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #f7fafc; }
        tr:hover { background-color: #ebf8ff; }
    </style>
</head>
<body>

<div class="main-container">
    <h2>
        <span>డేటా మెర్జర్ & ఆటోమేషన్ టూల్</span>
        <span class="brand">Smart Excel Merge</span>
    </h2>
    
    <div class="form-group">
        <label>1. ఎక్సెల్ ఫైల్స్ ఎంచుకోండి (మల్టిపుల్ ఫైల్స్ సెలెక్ట్ చేసుకోవచ్చు):</label>
        <input type="file" id="excelFiles" accept=".xlsx, .xls" multiple>
    </div>

    <label>2. పవర్‌ఫుల్ ఆప్షన్స్ (కావాల్సినవి టిక్ చేయండి):</label>
    <div class="options-grid">
        <div class="checkbox-group">
            <input type="checkbox" id="removeDuplicates" checked>
            <label for="removeDuplicates">
                <strong>డూప్లికేట్స్ డిలీట్ చేయి</strong>
                (ఒకే సర్వీస్ నెంబర్ 2 సార్లు ఉంటే తీసేస్తుంది).
            </label>
        </div>
        
        <div class="checkbox-group">
            <input type="checkbox" id="autoFormatSCNO" checked>
            <label for="autoFormatSCNO">
                <strong>కోడ్ + ఏరియా ఆటో ఫార్మాట్</strong>
                (ఉదా: 01101-001 -> 01101-manuguru గా మారుస్తుంది).
            </label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="addExtraColumns" checked>
            <label for="addExtraColumns">
                <strong>కొత్త మీటర్ కాలమ్స్ యాడ్ చేయి</strong>
                (Meter Status, Present Reading, Remarks లాంటివి ఆటోమాటిక్ గా వస్తాయి).
            </label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="splitByArea">
            <label for="splitByArea">
                <strong>ఏరియాల వారీగా షీట్స్ (Tabs) విభజించు</strong>
                (వేరువేరు ఏరియాలకు వేరువేరు షీట్స్ వస్తాయి).
            </label>
        </div>
    </div>

    <div class="form-group">
        <label>3. ఫైనల్ ఫైల్ పేరు:</label>
        <input type="text" id="outputFileName" value="Manuguru_Merged_Data" placeholder="ఫైల్ పేరు టైప్ చేయండి">
    </div>

    <div class="btn-container">
        <button class="btn-merge" onclick="processExcelFiles()">డేటాను ప్రాసెస్ చేయి</button>
        <button class="btn-download" id="downloadBtn" onclick="downloadMergedFile()">ప్రాసెస్ అయిన ఫైల్ డౌన్‌లోడ్ చేయి</button>
    </div>

    <div id="status" class="status-box"></div>

    <div id="previewSection" class="preview-section">
        <h3>లైవ్ డేటా ప్రివ్యూ & సెర్చ్:</h3>
        <input type="text" id="searchInput" class="search-box" onkeyup="filterTable()" placeholder="సర్వీస్ నెంబర్ (SC NO) తో వెతకండి...">
        <div class="table-responsive" id="previewTableContainer"></div>
    </div>
</div>

<script>
    let finalMergedData = [];
    let splitDataObj = {}; // For area wise split

    async function processExcelFiles() {
        const files = document.getElementById('excelFiles').files;
        const status = document.getElementById('status');
        
        if (files.length === 0) {
            alert("దయచేసి ఫైల్స్ ఎంచుకోండి!"); return;
        }

        status.style.color = "blue";
        status.innerText = "ప్రాసెస్ అవుతోంది... దయచేసి వెయిట్ చేయండి.";
        document.getElementById('previewSection').style.display = "none";
        document.getElementById('downloadBtn').style.display = "none";

        let combinedData = [];

        try {
            // Read all files
            for (let i = 0; i < files.length; i++) {
                const sheetData = await readExcelFile(files[i]);
                combinedData = combinedData.concat(sheetData);
            }

            // Identify Key Columns (SC NO and Area)
            let scKey = null;
            let areaKey = null;
            
            if(combinedData.length > 0) {
                const sampleRow = combinedData[0];
                for (let key in sampleRow) {
                    let cleanKey = key.toLowerCase().replace(/[\s_\-.]/g, '');
                    if (cleanKey.includes('scno') || cleanKey.includes('serviceno')) scKey = key;
                    if (cleanKey.includes('area') || cleanKey.includes('village')) areaKey = key;
                }
                if (!scKey) scKey = Object.keys(sampleRow)[0]; // Fallback to first column
            }

            // 1. Remove Duplicates
            if (document.getElementById('removeDuplicates').checked && combinedData.length > 0) {
                const seen = new Set();
                combinedData = combinedData.filter(row => {
                    let val = row[scKey] !== undefined ? String(row[scKey]).trim() : JSON.stringify(row);
                    if (seen.has(val)) return false;
                    seen.add(val);
                    return true;
                });
            }

            // 2. Auto Format SC NO & Area
            if (document.getElementById('autoFormatSCNO').checked && scKey && areaKey) {
                combinedData = combinedData.map(row => {
                    let scValue = String(row[scKey] || "");
                    let areaValue = String(row[areaKey] || "");
                    
                    if(scValue.includes("-") && areaValue) {
                        let prefix = scValue.split("-")[0];
                        row['Formatted_SC'] = `${prefix}-${areaValue}`;
                    } else if (scValue && areaValue) {
                        row['Formatted_SC'] = `${scValue}-${areaValue}`;
                    }
                    return row;
                });
            }

            // 3. Add Extra Meter Columns
            if (document.getElementById('addExtraColumns').checked) {
                combinedData = combinedData.map(row => {
                    row['Meter_Status'] = "";
                    row['Present_Reading'] = "";
                    row['Remarks'] = "";
                    row['Date'] = "";
                    return row;
                });
            }

            finalMergedData = combinedData;

            // Sort Data automatically by SC NO
            finalMergedData.sort((a, b) => {
                let valA = String(a[scKey] || "");
                let valB = String(b[scKey] || "");
                return valA.localeCompare(valB, undefined, {numeric: true, sensitivity: 'base'});
            });

            // Prepare for Area Split if checked
            splitDataObj = {};
            if (document.getElementById('splitByArea').checked && areaKey) {
                finalMergedData.forEach(row => {
                    let area = String(row[areaKey] || "Unknown_Area").trim();
                    if(!splitDataObj[area]) splitDataObj[area] = [];
                    splitDataObj[area].push(row);
                });
            }

            // Show Preview
            if (finalMergedData.length > 0) {
                showPreview(finalMergedData);
                document.getElementById('previewSection').style.display = "block";
            }

            status.style.color = "green";
            status.innerHTML = `✅ ప్రాసెస్ పూర్తయింది! <b>మొత్తం ${finalMergedData.length} రికార్డులు</b> రెడీగా ఉన్నాయి. ప్రివ్యూ చెక్ చేసుకుని డౌన్‌లోడ్ చేయండి.`;
            document.getElementById('downloadBtn').style.display = "block";

        } catch (error) {
            console.error(error);
            status.style.color = "red";
            status.innerText = "ఎర్రర్! ఫైల్స్ సరిగ్గా ఉన్నాయో లేదో చెక్ చేయండి.";
        }
    }

    function readExcelFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName]);
                resolve(jsonData);
            };
            reader.onerror = (err) => reject(err);
            reader.readAsArrayBuffer(file);
        });
    }

    function showPreview(data) {
        const container = document.getElementById('previewTableContainer');
        let html = '<table id="previewTable"><thead><tr>';
        const headers = Object.keys(data[0]);
        headers.forEach(h => html += `<th>${h}</th>`);
        html += '</tr></thead><tbody>';
        
        // Show max 100 rows in preview for performance
        const previewLimit = Math.min(data.length, 100);
        for(let i=0; i<previewLimit; i++) {
            html += '<tr>';
            headers.forEach(h => {
                html += `<td>${data[i][h] !== undefined ? data[i][h] : ''}</td>`;
            });
            html += '</tr>';
        }
        html += '</tbody></table>';
        container.innerHTML = html;
    }

    // Live Search Function
    function filterTable() {
        const input = document.getElementById("searchInput");
        const filter = input.value.toUpperCase();
        const table = document.getElementById("previewTable");
        const tr = table.getElementsByTagName("tr");

        for (let i = 1; i < tr.length; i++) {
            let rowText = tr[i].innerText || tr[i].textContent;
            if (rowText.toUpperCase().indexOf(filter) > -1) {
                tr[i].style.display = "";
            } else {
                tr[i].style.display = "none";
            }
        }
    }

    function downloadMergedFile() {
        if (finalMergedData.length === 0) return;
        
        let customName = document.getElementById('outputFileName').value.trim() || "Merged_Data";
        const newWorkbook = XLSX.utils.book_new();

        if (document.getElementById('splitByArea').checked && Object.keys(splitDataObj).length > 0) {
            // Create Multiple Sheets by Area
            for (let area in splitDataObj) {
                // Ensure sheet name is valid (max 31 chars, no special characters)
                let safeSheetName = area.replace(/[\\/?*\[\]]/g, '').substring(0, 31);
                const sheet = XLSX.utils.json_to_sheet(splitDataObj[area]);
                XLSX.utils.book_append_sheet(newWorkbook, sheet, safeSheetName || "Data");
            }
        } else {
            // Single Sheet
            const sheet = XLSX.utils.json_to_sheet(finalMergedData);
            XLSX.utils.book_append_sheet(newWorkbook, sheet, "All_Data");
        }
        
        XLSX.writeFile(newWorkbook, `${customName}.xlsx`);
    }
</script>

</body>
</html>
